pagination:
  style: cursor
  params:
  - limit
  - startingAfter
  - endingBefore
  response_fields:
  - data[]
  - links.previous
  - links.next
  note: Cursor pagination via opaque startingAfter/endingBefore; response carries a links object with
    previous/next.
versioning:
  scheme: unversioned-additive
  note: No URI/header version. Neon avoids backwards-incompatible changes by adding fields and deprecating
    old ones rather than versioning (see changelog). Webhook payloads are explicitly versioned (V1/V2
    schemas) and pinned at subscription time.
error_envelope:
  shape: custom
  fields:
  - statusCode
  - code (stable programmatic string)
  - message
  - errors[] (ErrorDetail)
  note: Not RFC 9457 problem+json; a custom APIError object with a stable 'code'. See errors/neon-commerce-problem-types.yml.
webhooks:
  signing: HMAC-SHA256
  header: x-neon-digest (webhooks/callbacks); X-Neon-Signature-* for signed serverless client responses
  verification: Recreate HMAC-SHA256 over the raw body with your shared secret; serverless responses sign
    {timestamp}.{responseBody} verified with the dashboard public key.
  retries: Webhooks retried up to 36h; callbacks up to 3x; exponential backoff 2^attempt - 1 seconds.
  ref: asyncapi/neon-commerce-webhooks-asyncapi.yml
